version = 1

[defaults]
timezone = "Africa/Casablanca"
notify   = ["log"]

# A notifier you can point jobs at by name. "log" is always available and needs
# no declaration; declare others like this.
[[notifier]]
name          = "alerts"
type          = "webhook"
url           = "https://example.com/hook"   # Slack/Discord/custom all work
failures_only = true                          # only fire when a job fails

# Schedules can be written in plain words...
[[job]]
name     = "heartbeat"
schedule = "every minute"
command  = "echo alive"

[[job]]
name       = "nightly-backup"
schedule   = "every day at 3am"
command    = "/opt/backup.sh"
timeout    = "30m"
notify     = ["log", "alerts"]

[[job]]
name     = "workday-standup-ping"
schedule = "every weekday at 8:45am"
command  = "/opt/notify-standup.sh"

# ...or in classic cron syntax, if you prefer or need the extra control.
[[job]]
name     = "quarter-hourly-sync"
schedule = "*/15 * * * *"
command  = "/opt/sync.sh"
