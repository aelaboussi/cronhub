name: release

# Runs when you push a version tag like v0.1.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the GitHub Release and upload binaries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run tests
        run: go test ./...

      - name: Build binaries for every platform
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          # target list: GOOS GOARCH suffix
          build() {
            local goos="$1" goarch="$2" ext="$3"
            local out="cronhub-${goos}-${goarch}${ext}"
            echo "building ${out}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${out}" ./cmd/cronhub
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"

      - name: Make checksums
        run: |
          cd dist
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
